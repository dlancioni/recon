{
    "Id": "1",
    "Name": "Invoice reconciliation",
    "Email": "",
    "Description": "Reconcile ETB against external spreadsheet",
    "Results": "All",
    "Datasources":
    [
        {
            "Side": "1",
            "Name": "ETB",
            "Type": "Db",
            "Conector": "connector_db.cfg",
            "Query": "invoice.sql",
            "Campos":
            [
                {"Position":"1", "Name":"Invoice Nr", "Tipo":"Text"},
                {"Position":"2", "Name":"Settlement Date", "Tipo":"Text"},
                {"Position":"3", "Name":"Maturity Date", "Tipo":"Text"},
                {"Position":"4", "Name":"Currency", "Tipo":"Text"},
                {"Position":"5", "Name":"Gross Amount", "Tipo":"Decimal", "Mask":"."}
            ]
        }
        ,
        {
            "Side": "2",
            "Name": "Operations Control",
            "Type": "Excel",
            "Path": "",
            "File": {"Name": "invoice.xlsx"},
            "Sheet": "Sheet1",
            "Start": "2",
            "Fields":
            [
                {"Position":"1", "Name":"Invoice Nr", "Tipo":"Text"},
                {"Position":"2", "Name":"Settlement Date", "Tipo":"Text"},
                {"Position":"3", "Name":"Maturity Date", "Tipo":"Text"},
                {"Position":"4", "Name":"Currency", "Tipo":"Text"},
                {"Position":"5", "Name":"Gross Amount", "Tipo":"Decimal", "Mask":"."}
            ]
        }
    ],
    "Recon":
    [
        {
            "Rule": "Regra 1",
            "Fields":
            [
                {"Type":"Key", "Name":"Invoice Nr"},
                {"Type":"Compare", "Name":"Settlement Date"},
                {"Type":"Compare", "Name":"Maturity Date"},
                {"Type":"Compare", "Name":"Currency"},
                {"Type":"Compare", "Name":"Gross Amount"}                                                
            ]
        }
    ]
}